# Operator-assisted E2E: the settings modal behind the gear/gift icon.
#
# One double-duty icon in the toolbar's trailing cluster: a pulsing What's-new
# gift while the changelog has unseen content (click deep-links to that tab),
# a settings gear once caught up (click opens on Behavior). The modal's left
# rail holds Behavior, What's new, and About; opening What's new marks the
# feed seen, which flips the icon live — no reload needed.
#
# The harness runs the plugin's dev build, so the running tree carries the
# [Unreleased] changelog group: without a `?lastSeenVersion=` seed the dev
# build pulses it, exactly as a fresh dev install does. Steps 1–3 use that
# standing state instead of simulating an upgrade (hardcoding a
# lastSeenVersion here rots on every release bump).
#
# Run: npm run uat -- tests/manual/uat-whats-new.yaml
suite: whats-new
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5175
defaults:
  groupBy: status
  theme: dark

steps:
  # A dev tree with a standing [Unreleased] group starts with the gift
  # pulsing — the same shirt a fresh dev install wears.
  - id: dev-tree-pulses-its-standing-group
    title: The standing [Unreleased] group shows the gift, pulsing
    goto: "?groupBy=status"
    assert:
      - whats_new: { icon: true, unseen: true }

  - id: gift-click-deep-links-to-whats-new
    title: The pulse click opens the modal straight on What's new
    click_aria: { label: "What's new" }
    assert:
      # Opening the feed marks it seen in the same click, so the costume is
      # already quiet here — step 3 only confirms the gear label that design
      # produces.
      - whats_new: { icon: true, unseen: false, modal: true, tab: "What's new" }
      - text_visible: "Unreleased"
      - text_visible: "Recent changes since you last looked."

  - id: opening-marks-seen
    title: Having opened the feed once, the pulse clears — the icon is now a gear
    press_escape: true
    assert:
      - whats_new: { icon: true, unseen: false, modal: false }

  - id: gear-opens-on-behavior
    title: The caught-up gear opens the modal on Behavior
    click_aria: { label: "Focus Board settings" }
    assert:
      - whats_new: { icon: true, unseen: false, modal: true, tab: "Behavior" }
      - text_visible: "Thread pane: Escape stops a running thread first"

  - id: rail-tab-whats-new-still-reaches-the-feed
    title: The What's-new tab stays reachable from the rail, not just the pulse
    click_aria: { label: "What's new" }
    assert:
      - whats_new: { modal: true, tab: "What's new" }
      - text_visible: "Recent changes since you last looked."

  - id: rail-tab-about-shows-identity
    title: The About tab names the running build and where the source lives
    click_aria: { label: "About" }
    assert:
      - whats_new: { modal: true, tab: "About" }
      - text_visible: "dev build"
      - text_visible: "github.com/cristoslc/bb-plugin-focus-board"

  - id: escape-closes-the-modal
    title: Escape closes the modal; the settings icon remains
    press_escape: true
    assert:
      - whats_new: { icon: true, modal: false }

  - id: the-icon-never-disappears
    title: After everything is read, the icon stays — the changelog reaches back
    click_aria: { label: "Focus Board settings" }
    assert:
      - whats_new: { icon: true, modal: true, tab: "Behavior" }
