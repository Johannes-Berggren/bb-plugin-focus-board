# Operator-assisted E2E: the mobile tap latency budget (issue #265), run under
# the load conditions a phone actually reaches (issue #266).
#
# The suite renders the real app in the screenshot harness at a phone viewport,
# throttles the CPU to a phone-class rate, and loads a board with 300 synthetic
# threads on top of the base fixture (478 cards total). It then times the two
# taps the operator reported: opening a thread pane and closing it again.
#
# The budget is the number issue #265 measured on the PRODUCTION bundle after
# the memoization fix (a production React build measured ~230ms for the open
# and ~230ms for the close at this load; the runner serves the DEV harness, so
# its numbers run several hundred ms higher — see the OPT-IN note below). The
# unfixed build measured 260-530ms on production; the gap is what the budget
# guards.
#
# Run: npm run uat -- tests/manual/uat-tap-latency.yaml
# (npm run build first — the harness loads dist/app.css)
#
# OPT-IN (manual: true, issue #265/#266): the default sweep — `npm run uat`
# with no arguments, which `npm run release-safety` calls — SKIPS this suite.
# The 350ms budget was calibrated on the production bundle (scripts/screenshot/
# vite.probe.config.ts), but the UAT runner serves the DEV harness (React's
# development build), where the same tap measures several hundred ms more even
# after #265's memoization fix. Running it in the sweep would therefore fail
# every release for a reason that is an artifact of the harness, not the app.
# Name the file to run it: `npm run uat -- tests/manual/uat-tap-latency.yaml`.

suite: tap-latency
manual: true
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5190
defaults:
  groupBy: status
  theme: dark
  # The load conditions a mid-range phone is under: a 4x CPU throttle and a
  # 478-card board.
  viewport:
    width: 390
    height: 844
  scale: 300
  cpu_throttle: 4

steps:
  - id: a-tap-opens-the-pane-within-budget
    title: On a throttled phone with 478 cards, a tap opens the pane inside the latency budget
    goto: "?groupBy=status"
    # The gesture_budget assertion times the click's own round trip in page
    # time (dispatch to DOM-quiet), so the runner's own settle waits are not
    # part of the number.
    gestures:
      - click: { card: thr_uat_queue }
    assert:
      - pane: { threadId: thr_uat_queue }
      - gesture_budget: { gesture: click, max_ms: 350 }

  - id: a-tap-closes-the-pane-within-budget
    title: Tapping Back to board closes the pane inside the latency budget
    goto: "?groupBy=status"
    gestures:
      - click: { card: thr_uat_queue }
      - sleep: 400
      - click_aria: { label: "Back to board" }
    assert:
      - pane: { open: false }
      - gesture_budget: { gesture: click_aria, max_ms: 350 }
